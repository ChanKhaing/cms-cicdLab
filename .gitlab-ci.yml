image: node:18-alpine   # npm ပါနေပြီးသား — apk add မလုပ်ရတော့

stages:
  - cache
  - build
  - test

npm install:
  stage: cache
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: push 
    paths:
      - node_modules/
  script:
    - echo "Installing npm dependencies..."
    - npm ci


eslint:
  stage: test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - node_modules/
  script: 
    - echo "Running ESLint..."
    - npx eslint . --max-warnings 100



unit-tests:
  stage: test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - node_modules/
  script:
    - echo "Running unit tests..."
    - npx jest --coverage
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 10 mins





ts-build:
  stage: build
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths: 
      - node_modules/
  script:
  - echo "building ts to js"
  - npm run build:ts
  artifacts:
    paths: 
      - dist/
    expire_in: 10 days