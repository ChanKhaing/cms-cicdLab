image: node:18-alpine   # npm ပါနေပြီးသား — apk add မလုပ်ရတော့

stages:
  - cache
  - build
  - test

npm install:
  stage: cache
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: push 
    paths:
      - node_modules/
  script:
    - echo "Installing npm dependencies..."
    - npm ci


eslint:
  stage: test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - node_modules/
  script: 
    - echo "Running ESLint..."
    - npx eslint .



unit-tests:
  stage: test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - node_modules/
  script:
    - echo "Running unit tests..."
    - npx test
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 10 mins





