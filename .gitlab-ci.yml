# image: alpine #this is gloabl variable 

stages:
  - cache
  - build
  - test

npm install:
  stage: cache
  cache:
    paths:
      - node_modules/
  before_script:
    - apk add --update npm 
  script:
    - echo "Installing npm dependencies..."
    - npm install 


eslint:
  stage: test
  cache:
    paths:
      - node_modules/
  before_script:
    - apk add --update npm 
  when: manual
  script: 
    - echo "Running ESLint..."
    - npx eslint .


